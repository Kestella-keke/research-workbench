<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>科研很柯以工作台</title>
<style>
  :root{
    --bg:#f7f4ee;        /* 米白 */
    --card:#ffffff;
    --blue:#7aa7d4;      /* 淡蓝 */
    --blue-soft:#e3eefb;
    --purple:#b89ad6;    /* 淡粉紫 */
    --purple-soft:#efe6f7;
    --text:#3a3a44;
    --muted:#8a8a96;
    --line:#ece8e0;
    --danger:#e06b6b;
    --ok:#5fae7e;
    --warn:#e0a458;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;
  }
  /* 顶栏 */
  .topbar{
    height:56px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
  }
  .topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--blue);}
  .topbar .brand svg{color:var(--purple);}
  .topbar .tools{display:flex;gap:8px;}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;
    min-height:44px;padding:0 14px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:.15s;
  }
  .btn:hover{border-color:var(--blue);}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  .btn.primary:hover{filter:brightness(1.05);}
  .btn.ghost{background:var(--purple-soft);border-color:transparent;color:#6a4f8a;}
  .btn.sm{min-height:36px;padding:0 10px;font-size:14px;}
  .btn.danger{color:var(--danger);border-color:#f3d4d4;background:#fdf3f3;}
  .icon-btn{
    width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;color:var(--muted);
  }
  .icon-btn:hover{color:var(--blue);border-color:var(--blue);}
  /* 布局 */
  .layout{display:flex;min-height:calc(100vh - 56px);position:relative;z-index:1;}
  /* 角落水彩藤蔓装饰（背景层，不挡内容） */
  .corner-deco{position:fixed;z-index:0;pointer-events:none;opacity:.26;}
  .deco-tr{top:0;right:0;width:110px;height:110px;}
  .deco-bl{bottom:0;left:0;width:140px;height:160px;}
  @media(max-width:768px){.deco-tr,.deco-bl{width:80px;height:95px;opacity:.16;}}
  .sidebar{
    width:200px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
    padding:14px 10px;display:flex;flex-direction:column;gap:6px;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;cursor:pointer;
    color:var(--muted);font-size:15px;font-weight:600;
  }
  .nav-item svg{width:20px;height:20px;}
  .nav-item:hover{background:var(--blue-soft);color:var(--blue);}
  .nav-item.active{background:linear-gradient(135deg,var(--blue-soft),var(--purple-soft));color:var(--blue);}
  .content{flex:1;padding:18px;max-width:1100px;margin:0 auto;width:100%;}
  .view{display:none;}
  .view.active{display:block;}
  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .card h3{margin:0 0 8px;font-size:16px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;}
  .section-head h2{font-size:18px;margin:0;display:flex;align-items:center;gap:8px;}
  .section-head .right{display:flex;gap:6px;}
  .muted{color:var(--muted);}
  /* 首页 */
  .hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#eaf2fc,#f3ecf8);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px;}
  .hero-hi{font-size:20px;font-weight:800;color:var(--blue);}
  .hero-sub{font-size:14px;color:var(--muted);margin-top:4px;}
  .hero-badge{width:48px;height:48px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--purple);box-shadow:0 2px 6px rgba(120,120,160,.12);flex-shrink:0;}
  .hero-badge svg{width:26px;height:26px;}
  .quote{
    background:linear-gradient(135deg,var(--blue-soft),var(--purple-soft));border-radius:16px;
    padding:18px 20px;font-size:17px;line-height:1.6;color:#4a4a58;position:relative;
  }
  .quote .tag{font-size:13px;color:var(--purple);font-weight:700;display:block;margin-bottom:6px;}
  .hero-sub b{color:var(--danger);font-weight:700;}
  .overview{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0;}
  @media(min-width:768px){.overview{grid-template-columns:repeat(4,1fr);}}
  .ov-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .ov-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;}
  .ov-icon svg{width:30px;height:30px;}
  .ov-num{font-size:26px;font-weight:800;color:var(--blue);line-height:1;}
  .ov-lab{font-size:12px;color:var(--muted);}
  .today-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:8px;}
  .today-item.overdue{border-color:#f3c9c9;background:#fdf5f5;}
  .today-item.overdue .t-name{color:var(--danger);}
  .today-item .t-name{flex:1;font-weight:600;}
  .today-item .t-ddl{font-size:13px;color:var(--muted);}
  .today-item .t-ddl.soon{color:var(--warn);}
  .chip{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--blue-soft);color:var(--blue);}
  .chip.red{background:#fdeaea;color:var(--danger);}
  .done-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .done-item:last-child{border-bottom:none;}
  .done-item .d-type{color:var(--purple);font-weight:600;min-width:54px;}
  .done-item .d-name{flex:1;}
  .done-item .d-at{color:var(--muted);font-size:12px;}
  /* 表单 */
  .form-box{background:#fbfaf6;border:1px dashed var(--line);border-radius:12px;padding:14px;margin-bottom:12px;display:none;}
  .form-box.show{display:block;}
  .form-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
  .form-row > *{flex:1;min-width:140px;}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);}
  input,select,textarea{
    font-size:16px;font-family:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--text);width:100%;min-height:44px;
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  .tag-pick{display:flex;flex-wrap:wrap;gap:8px;}
  .tag-pick label{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:36px;}
  .tag-pick input{width:auto;min-height:auto;margin:0;}
  /* 论文卡片 */
  .paper{border-left:4px solid var(--blue);}
  .paper .p-title{font-size:17px;font-weight:700;color:#2f2f3a;margin-bottom:6px;}
  .paper .p-journal{display:inline-block;font-size:13px;color:var(--purple);background:var(--purple-soft);padding:2px 10px;border-radius:20px;margin-bottom:8px;}
  .paper .p-feed{display:inline-block;font-size:11px;color:#8a6d2f;background:#fff7e8;border:1px solid #f3e2bf;border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:middle;}
  .feed-note{font-size:13px;color:var(--muted);background:var(--blue-soft);border-radius:10px;padding:8px 12px;margin-bottom:12px;line-height:1.5;}
  .paper .p-abs{font-size:14px;color:#555;margin:6px 0;}
  .paper .p-kw{font-size:13px;color:var(--muted);}
  .paper .p-tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;}
  .p-tag{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--blue-soft);color:var(--blue);}
  .paper .p-note{margin-top:8px;font-size:13px;background:#fbfaf6;border-radius:10px;padding:8px 10px;color:#5a5a66;}
  /* 日程 */
  .ftbz .ftbz-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .ftbz .ftbz-name{flex:1;font-weight:700;font-size:16px;border:none;background:transparent;padding:4px;}
  .ftbz .ftbz-name:focus{background:var(--blue-soft);border-radius:8px;}
  .ftbz-meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:13px;color:var(--muted);}
  .ftbz-meta label{display:flex;align-items:center;gap:6px;}
  .ftbz-meta input{width:70px;min-height:38px;padding:6px 8px;}
  .ftbz-meta select{min-height:38px;padding:6px 8px;width:auto;}
  .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:120px;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:6px;transition:.3s;}
  .chk-box{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ok);flex-shrink:0;}
  .chk-box.on{background:var(--ok);border-color:var(--ok);color:#fff;}
  .chk-box svg{width:24px;height:24px;}
  .todo{display:flex;gap:12px;align-items:flex-start;}
  .todo.done{background:#f3f1ec;border-color:#e6e1d8;}
  .todo.done .t-name{text-decoration:line-through;color:var(--muted);}
  .todo.overdue{border-color:#f3c9c9;background:#fdf5f5;}
  .todo-body{flex:1;}
  .todo-body .t-name{font-weight:600;width:100%;border:none;background:transparent;padding:4px;font-size:15px;}
  .todo-body .t-name:focus{background:var(--blue-soft);border-radius:8px;}
  .todo-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .todo-meta .mini{width:auto;min-width:90px;min-height:38px;padding:6px 8px;font-size:14px;}
  .imp{font-weight:700;}
  .imp.高{color:var(--danger);}
  .imp.中{color:var(--warn);}
  .imp.低{color:var(--muted);}
  .goal .goal-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px;}
  .goal .goal-cat{font-size:12px;font-weight:600;color:#6a4f8a;background:var(--purple-soft);padding:2px 10px;border-radius:20px;flex-shrink:0;}
  .goal .goal-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .goal .goal-prog{font-size:14px;color:var(--muted);margin:6px 0;display:flex;align-items:center;gap:4px;}
  .goal .goal-prog svg{width:16px;height:16px;color:var(--ok);}
  .goal.met{background:#f3f1ec;border-color:#e6e1d8;}
  .goal.met .goal-head{color:var(--muted);}
  .goal .goal-actions{display:flex;gap:8px;margin-top:8px;}
  /* 健康 */
  .mood-pick{display:flex;flex-wrap:wrap;gap:8px;}
  .mood-btn{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;min-height:44px;}
  .mood-btn.on{background:var(--purple-soft);border-color:var(--purple);color:#6a4f8a;font-weight:700;}
  .health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
  /* 设置 */
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .set-row:last-child{border-bottom:none;}
  .set-row .desc{font-size:13px;color:var(--muted);margin-top:2px;}
  .about{font-size:14px;color:#555;line-height:1.7;background:#fbfaf6;border-radius:12px;padding:14px;}
  .about code{background:var(--blue-soft);padding:1px 6px;border-radius:6px;color:var(--blue);}
  .banner{background:#fff7e8;border:1px solid #f3e2bf;color:#8a6d2f;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;display:flex;align-items:center;gap:8px;}
  .empty{text-align:center;color:var(--muted);padding:24px;font-size:14px;}
  .field-filter{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px;}
  .ff-label{font-size:13px;color:var(--muted);margin-right:2px;}
  .chip{font-size:13px;padding:5px 12px;border:1px solid #e3e0d6;background:#fff;border-radius:18px;cursor:pointer;color:#555;transition:.15s;}
  .chip:hover{border-color:#7aa7d4;color:#7aa7d4;}
  .chip.active{background:#7aa7d4;border-color:#7aa7d4;color:#fff;}
  .ff-input{flex:1;min-width:140px;font-size:13px;padding:6px 12px;border:1px solid #e3e0d6;border-radius:18px;outline:none;}
  .ff-input:focus{border-color:#7aa7d4;}
  .p-field{font-size:12px;color:#5a7da6;background:#e8f0f2;padding:2px 8px;border-radius:10px;margin-left:4px;}
  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(40,40,50,.45);display:none;z-index:50;align-items:center;justify-content:center;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));}
  .modal.show{display:flex;}
  .modal-body{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:18px;}
  .modal-body h3{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;}
  .hist-item{padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .hist-item:last-child{border-bottom:none;}
  /* 移动端底部Tab */
  .mobile-tabbar{display:none;}
  @media(max-width:768px){
    .sidebar{display:none;}
    .content{padding:14px;padding-bottom:calc(86px + env(safe-area-inset-bottom));}
    .stats{grid-template-columns:repeat(3,1fr);gap:8px;}
    .stat .num{font-size:22px;}
    .mobile-tabbar{
      display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
      z-index:40;padding-bottom:env(safe-area-inset-bottom);
    }
    .mobile-tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--muted);cursor:pointer;}
    .mobile-tabbar .tab svg{width:22px;height:22px;}
    .mobile-tabbar .tab.active{color:var(--blue);}
    .topbar .tools .btn span.lbl{display:none;}
    .topbar .tools .btn{min-width:44px;justify-content:center;padding:0 10px;}
  }

  /* 方案C 论文卡增强 */
  .p-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 4px;}
  .match-bar{width:70px;height:7px;background:#e8edf2;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;}
  .match-fill{height:100%;background:linear-gradient(90deg,#7aa7d4,#9bbde4);border-radius:4px;}
  .match-num{font-size:12px;color:#7aa7d4;margin-left:4px;font-weight:600;}
  .quality-pill{font-size:11px;border-radius:20px;padding:2px 8px;display:inline-block;}
  .quality-pill.q-top{color:#8a6d2f;background:#fff7e8;border:1px solid #f3e2bf;}
  .quality-pill.q-auth{color:#5f7d4a;background:#eef6e9;border:1px solid #d4e5cc;}
  .quality-pill.q-core{color:#5d7a9e;background:#e8f0f8;border:1px solid #c5d1e8;}
  .quality-pill.q-normal{color:#8a8a96;background:#f4f4f6;border:1px solid #e2e2e6;}
  .p-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
  .p-actions .btn{font-size:12px;padding:4px 10px;min-height:34px;}
  .card.ignored{opacity:.5;background:#f9f9fb;}
  .card.ignored .p-title{text-decoration:line-through;color:#8a8a96;}
  .ignored-section{margin-top:16px;}
  .ignored-section summary{font-size:14px;color:var(--muted);cursor:pointer;padding:8px 0;}
  .kw-cloud{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;}
  .kw-tag{display:inline-block;padding:3px 10px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--text);}
  .kw-trend{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.6;}
  /* AI 水彩插画（base64 内联） */
  .corner-deco img{width:100%;height:100%;object-fit:cover;}
  .deco-bl img{transform:scaleX(-1);}
  .hero-badge{overflow:hidden;}
  .hero-badge img{width:130%;height:130%;object-fit:cover;transform:translate(-12%,-12%);clip-path:inset(0 0 10% 0);}
  .home-deco{width:90px;height:90px;object-fit:cover;opacity:.72;}
  .health-deco{width:72px;height:72px;object-fit:cover;opacity:.5;transform:rotate(90deg);}
</style>

  <!-- 全局水彩滤镜 / 渐变 / 星芒 定义（被所有插画共用） -->

      </radialGradient>
      <radialGradient id="gBell" cx="50%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#eef1f9"/><stop offset="58%" stop-color="#c5d1e8"/><stop offset="100%" stop-color="#a9bbe0"/>
      </radialGradient>
      <radialGradient id="gMint" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#eef6f4"/><stop offset="100%" stop-color="#cfe6e2"/>
      </radialGradient>
      <radialGradient id="gSage" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#d3e2c9"/><stop offset="100%" stop-color="#a9c298"/>
      </radialGradient>
      <radialGradient id="gGold" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fdeec2"/><stop offset="100%" stop-color="#e9c878"/>
      </radialGradient>
      <radialGradient id="gCat" cx="42%" cy="36%" r="66%">

      <symbol id="spark" viewBox="-10 -10 20 20">

      </symbol>
    </defs>
  </svg>
  <div class="corner-deco deco-tr" id="decoTR" aria-hidden="true"></div>
  <div class="corner-deco deco-bl" id="decoBL" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand"><span id="brandIcon"></span> 科研很柯以工作台</div>

<script>
/* ============ 基础工具 ============ */
const PREFIX='wb_research_';
function load(k,d){try{const v=localStorage.getItem(PREFIX+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){localStorage.setItem(PREFIX+k,JSON.stringify(v));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function dateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da;}
function todayStr(){return dateStr(new Date());}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function weekStart(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return dateStr(x);}

/* ============ 图标 ============ */

function buildNav(){

  sb.innerHTML=NAVS.map(n=>'<div class="nav-item'+(n.id===curView?' active':'')+'" onclick="showView(\''+n.id+'\')">'+n.icon+'<span>'+n.label+'</span></div>').join('');

let curView='home';
function showView(v){
  curView=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  buildNav();
  if(v==='home')renderHome();
  else if(v==='research')renderResearch();
  else if(v==='schedule')renderSchedule();
  else if(v==='health')renderHealth();
  else if(v==='settings')renderSettings();
  window.scrollTo(0,0);
}

function recentCompletions(){
  let arr=[];
  todos.filter(t=>t.done&&t.doneAt).forEach(t=>arr.push({type:'待办',name:t.name,at:t.doneAt}));
  ftbzHistory.forEach(h=>arr.push({type:'论文',name:h.name,at:h.completedAt}));
  arr.sort((a,b)=>b.at-a.at);
  return arr.slice(0,5);
}
function todayItems(){
  const t=todayStr();
  let items=[];
  todos.filter(x=>!x.done).forEach(x=>{
    const overdue=x.ddl&&x.ddl<t;
    const isToday=x.ddl===t;
    const soon=x.ddl&&x.ddl>t&&(new Date(x.ddl)-new Date(t))<=2*864e5;
    if(overdue||isToday||soon||!x.ddl)items.push({id:x.id,name:x.name,ddl:x.ddl,overdue:!!overdue,soon:!!soon&&!overdue});
  });
  return items;
}

/* ============ 科研热点 ============ */
function setField(f){
  meta.researchField=(f||'').trim()||'全部';
  save('meta',meta);
  renderResearch();
}
function renderResearch(){
  let html='';
  // 论文列表
  html+='<div class="section-head"><h2>'+ICON.research+' 科研热点 · 论文库</h2>'
    +'<div class="right"><button class="btn sm ghost" onclick="reloadFeed()">恢复推荐论文</button>'
    +'<button class="icon-btn" title="新增" onclick="toggleForm(\'paperForm\')">'+ICON.plus+'</button>'
    +'<button class="icon-btn" title="选题库历史" onclick="showHistory(\'topicgen\')">'+ICON.clock+'</button></div></div>';
  html+='<div class="feed-note">论文库每周自动从精选 feed 更新（仅含标题/期刊/摘要等公开信息，不含你的私人标注）。可在下方选择你的研究方向，只显示相关论文。</div>';

  const FIELDS=['全部','公共管理','经济学','社会学','政治学','数据科学','教育学','管理学'];
  const curF=meta.researchField||'全部';
  html+='<div class="field-filter"><span class="ff-label">研究方向</span>'
    +FIELDS.map(f=>'<button class="chip'+(f===curF?' active':'')+'" onclick="setField(\''+f+'\')">'+f+'</button>').join('')
    +'<input id="customField" class="ff-input" placeholder="或输入自定义领域…" value="'+((curF&&!FIELDS.includes(curF))?esc(curF):'')+'" onchange="setField(this.value)"></div>';

  html+='<div class="form-box" id="paperForm">'
    +'<div class="form-row"><label class="fld">中文标题<input id="p_title" placeholder="论文标题"></label>'
    +'<label class="fld">发表期刊<input id="p_journal" placeholder="如：财政研究"></label></div>'
    +'<label class="fld">摘要<textarea id="p_abs" placeholder="粘贴摘要"></textarea></label>'
    +'<label class="fld">关键词（分号分隔）<input id="p_kw" placeholder="成本预算绩效管理;支出效率"></label>'
    +'<div class="fld">亮点标签（可多选）</div><div class="tag-pick" id="p_tags">'+TAG_OPTS.map(tg=>'<label><input type="checkbox" value="'+tg+'">'+tg+'</label>').join('')+'</div>'
    +'<div class="form-row" style="margin-top:10px"><label class="fld">匹配度(%)<input type="number" id="p_match" min="0" max="100" placeholder="0-100"></label>'
    +'<label class="fld">来源质量<select id="p_quality"><option>普通</option><option>核心</option><option>权威</option><option>顶刊</option></select></label>'

    +'<label class="fld">推荐理由/笔记<textarea id="p_reason" placeholder="为什么值得读、对你选题的启发…"></textarea></label>'
    +'<button class="btn primary" onclick="addPaper()">保存论文</button>'
    +'</div>';

  const curF=meta.researchField||'全部';
  const ignored=papers.filter(p=>p.ignored);

    const kw=curF.toLowerCase();

    html+=renderPaperCard(p,false);

  // 标签分布图

  // 生成选题库
  html+='<div class="section-head"><h2>选题与推荐库</h2>'
    +'<button class="btn primary sm" onclick="genTopic()">'+ICON.download+' 生成并下载 Markdown</button></div>';
  html+='<div class="about">基于 '+papers.length+' 篇论文自动聚合：期刊分布、来源质量、亮点标签频率、高频关键词与匹配度，并给出选题启发；每篇可一键加入选题、标记精读或忽略。'
    +(meta.lastTopicGen?'<br>上次生成：'+dateStr(new Date(meta.lastTopicGen))+'（建议每周/每月生成一次以保证质量）。':'<br>尚未生成过。')+'</div>';

  // 自己想写的选题（可编辑）
  html+='<div class="section-head"><h2>我自己的选题</h2>'
    +'<button class="icon-btn" title="新增" onclick="toggleForm(\'topicForm\')">'+ICON.plus+'</button></div>';
  html+='<div class="form-box" id="topicForm">'
    +'<label class="fld">选题名称<input id="t_title" placeholder="我想写的选题"></label>'
    +'<label class="fld">可行性自评<textarea id="t_feas" placeholder="数据可得性、方法难度、创新点…"></textarea></label>'
    +'<label class="fld">备注<input id="t_note" placeholder="参考论文/思路"></label>'
    +'<button class="btn primary" onclick="addTopic()" style="margin-top:8px">保存选题</button>'
    +'</div>';
  if(topics.length===0)html+='<div class="empty">记录你真正想写的选题，生成选题库时会一并导出。</div>';
  else topics.forEach(tp=>{
    html+='<div class="card">'
      +'<input class="inline-input" style="font-weight:700;font-size:16px;border:none;width:100%" value="'+esc(tp.title)+'" onchange="updTopic(\''+tp.id+'\',\'title\',this.value)">'
      +'<label class="fld" style="margin-top:6px">可行性自评</label><textarea onchange="updTopic(\''+tp.id+'\',\'feasibility\',this.value)">'+esc(tp.feasibility||'')+'</textarea>'
      +'<label class="fld" style="margin-top:6px">备注</label><input value="'+esc(tp.note||'')+'" onchange="updTopic(\''+tp.id+'\',\'note\',this.value)">'
      +'<div style="margin-top:8px"><button class="btn sm danger" onclick="delTopic(\''+tp.id+'\')">删除</button></div>'
      +'</div>';
  });

  html+='<div class="section-head"><h2>本周关键词趋势</h2></div>'+keywordCloudHTML();
  document.getElementById('view-research').innerHTML=html;
}
function addPaper(){
  const title=document.getElementById('p_title').value.trim();
  if(!title){alert('请填写标题');return;}
  const tags=Array.from(document.querySelectorAll('#p_tags input:checked')).map(c=>c.value);
  const matchVal=parseInt(document.getElementById('p_match').value,10);
  const match=(isNaN(matchVal)||matchVal<0||matchVal>100)?null:matchVal;
  papers.push({id:uid(),title, journal:document.getElementById('p_journal').value.trim(),
    abstract:document.getElementById('p_abs').value.trim(), keywords:document.getElementById('p_kw').value.trim(),
    tags, match, quality:document.getElementById('p_quality').value,
    reason:document.getElementById('p_reason').value.trim(),
    date:document.getElementById('p_date').value||todayStr(), demo:false});
  save('papers',papers);renderResearch();
}
function delPaper(id){papers=papers.filter(p=>p.id!==id);save('papers',papers);renderResearch();}
function addTopic(){
  const title=document.getElementById('t_title').value.trim();
  if(!title){alert('请填写选题名称');return;}
  topics.push({id:uid(),title,feasibility:document.getElementById('t_feas').value.trim(),note:document.getElementById('t_note').value.trim(),demo:false});
  save('topics',topics);renderResearch();
}
function updTopic(id,f,v){const t=topics.find(x=>x.id===id);if(t){t[f]=v;save('topics',topics);}}
function delTopic(id){topics=topics.filter(t=>t.id!==id);save('topics',topics);renderResearch();}

function qualityClass(q){
  if(q==='顶刊')return 'top';if(q==='权威')return 'auth';if(q==='核心')return 'core';return 'normal';
}
function renderPaperCard(p,isIgnored){
  return '<div class="card paper'+(isIgnored?' ignored':'')+'">'
    +'<div class="p-title">'+esc(p.title)+'</div>'
    +'<div class="p-meta">'
    +'<span class="p-journal">'+esc(p.journal)+'</span>'+(p.field?'<span class="p-field">'+esc(p.field)+'</span>':'')
    +(p.seed?'<span class="p-feed">feed</span>':'')
    +(p.quality?'<span class="quality-pill q-'+qualityClass(p.quality)+'">'+esc(p.quality)+'</span>':'')
    +(p.match!=null?'<span><span class="match-bar"><span class="match-fill" style="width:'+p.match+'%"></span></span><span class="match-num">'+p.match+'%</span></span>':'')
    +'</div>'
    +'<div class="p-abs">'+esc(p.abstract||'（无摘要）')+'</div>'
    +'<div class="p-kw">关键词：'+(esc(p.keywords)||'—')+'</div>'
    +'<div class="p-tags">'+(p.tags||[]).map(tg=>'<span class="p-tag">'+tg+'</span>').join('')+'</div>'
    +(p.reason?'<div class="p-note">推荐：'+esc(p.reason)+'</div>':'')
    +'<div class="p-actions">'
    +'<button class="btn sm" onclick="paperToTopic(\''+p.id+'\')">加入选题</button>'
    +'<button class="btn sm '+(p.intensive?'primary':'')+'" onclick="toggleIntensive(\''+p.id+'\')">'+(p.intensive?'已精读':'标记精读')+'</button>'
    +'<button class="btn sm" onclick="toggleIgnored(\''+p.id+'\')">'+(isIgnored?'取消忽略':'忽略')+'</button>'
    +'<button class="btn sm danger" onclick="delPaper(\''+p.id+'\')">删除</button>'
    +'</div>'
    +'</div>';
}
function paperToTopic(id){
  const p=papers.find(x=>x.id===id);if(!p)return;
  const title=prompt('加入选题库', p.title+' 的启示');
  if(!title||!title.trim())return;
  topics.push({id:uid(),title:title.trim(),feasibility:'参考《'+p.journal+'》：'+p.title,note:p.keywords||'',demo:false});
  save('topics',topics);renderResearch();
}
function toggleIntensive(id){
  const p=papers.find(x=>x.id===id);if(p){p.intensive=!p.intensive;save('papers',papers);renderResearch();}
}
function toggleIgnored(id){
  const p=papers.find(x=>x.id===id);if(p){p.ignored=!p.ignored;save('papers',papers);renderResearch();}
}
function keywordCloudHTML(){
  const kd={};papers.forEach(p=>(p.keywords||'').split(/[;；,，]/).map(s=>s.trim()).filter(Boolean).forEach(k=>kd[k]=(kd[k]||0)+1));
  const entries=Object.entries(kd).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0)return '<div class="empty">暂无关键词数据。</div>';
  const max=entries[0][1];
  const colors=['#7aa7d4','#b89ad6','#5fae7e','#e0a458','#d4a5a5'];
  const cloud=entries.slice(0,18).map((e,i)=>{
    const size=Math.round(12+(e[1]/max)*8);
    return '<span class="kw-tag" style="font-size:'+size+'px;color:'+colors[i%colors.length]+'">'+esc(e[0])+' <b>'+e[1]+'</b></span>';
  }).join('');
  const top3=entries.slice(0,3).map(e=>e[0]).join('、');
  return '<div class="kw-cloud">'+cloud+'</div>'
    +'<div class="kw-trend">本周高频：'+esc(top3)+'。可重点关注这些关键词与你选题的交集。</div>';
}

function tagBarSVG(){
  const td={};papers.forEach(p=>(p.tags||[]).forEach(t=>td[t]=(td[t]||0)+1));
  const entries=Object.entries(td).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0)return '<div class="empty">暂无标签数据。</div>';
  const max=Math.max(...entries.map(e=>e[1]));
  const h=entries.length*34+10;
  const bars=entries.map((e,i)=>{
    const bw=Math.max(8,e[1]/max*420);const y=10+i*34;
    return '<rect x="150" y="'+y+'" width="'+bw+'" height="20" rx="4" fill="#7aa7d4"></rect>'
      +'<text x="142" y="'+(y+15)+'" text-anchor="end" font-size="13" fill="#3a3a44">'+esc(e[0])+'</text>'
      +'<text x="'+(150+bw+6)+'" y="'+(y+15)+'" font-size="12" fill="#8a8a96">'+e[1]+'</text>';
  }).join('');
  return '<svg viewBox="0 0 600 '+h+'" width="100%" height="'+h+'" style="background:#fff;border:1px solid var(--line);border-radius:12px">'+bars+'</svg>';
}

function genTopic(){
  if(papers.length===0){alert('还没有论文数据，先添加几篇再生成。');return;}
  const lines=[];
  lines.push('# 选题与推荐库');
  lines.push('> 由「科研主控台」自动生成于 '+new Date().toLocaleString('zh-CN'));
  lines.push('');
  lines.push('## 一、论文来源概览');
  lines.push('- 已收录论文：'+papers.length+' 篇');
  const jd={};papers.forEach(p=>jd[p.journal]=(jd[p.journal]||0)+1);
  lines.push('- 期刊分布：');Object.entries(jd).forEach(([k,v])=>lines.push('  - '+k+'：'+v+' 篇'));
  const qd={};papers.forEach(p=>{const q=p.quality||'未标注';qd[q]=(qd[q]||0)+1;});
  lines.push('- 来源质量分布：');Object.entries(qd).forEach(([k,v])=>lines.push('  - '+k+'：'+v+' 篇'));
  const td={};papers.forEach(p=>(p.tags||[]).forEach(t=>td[t]=(td[t]||0)+1));
  lines.push('- 亮点标签频率：');Object.entries(td).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>lines.push('  - '+k+'：'+v));
  lines.push('');
  lines.push('## 二、高匹配论文与精读推荐');
  const high=papers.filter(p=>p.match!=null).sort((a,b)=>b.match-a.match).slice(0,5);
  if(high.length===0)lines.push('- （暂无匹配度数据，可在论文卡中补充）');
  else high.forEach(p=>lines.push('- '+p.title+'（《'+p.journal+'》）匹配度 '+p.match+'%\n  推荐理由：'+(p.reason||'—')));
  const intensive=papers.filter(p=>p.intensive);
  lines.push('- 已标记精读 '+intensive.length+' 篇：');
  if(intensive.length===0)lines.push('  - （暂无）');
  else intensive.forEach(p=>lines.push('  - '+p.title));
  lines.push('');
  lines.push('## 三、推荐选题方向（启发式）');
  const nv=papers.filter(p=>(p.tags||[]).includes('新变量'));
  const nm=papers.filter(p=>(p.tags||[]).includes('新方法'));
  lines.push('- 含「新变量」的论文（潜在可复用的新变量）：');
  nv.forEach(p=>lines.push('  - '+p.title+'（《'+p.journal+'》）'));
  lines.push('- 含「新方法」的论文（潜在可复现的新方法）：');
  nm.forEach(p=>lines.push('  - '+p.title+'（《'+p.journal+'》）'));
  lines.push('- 建议：尝试将「新变量」论文的关键词与「新方法」论文的方法组合，形成可复现的定量选题；优先选导师大方向（预算绩效×政府治理）交叉的切口。');
  lines.push('');
  lines.push('## 四、本周关键词趋势');
  const kd={};papers.forEach(p=>(p.keywords||'').split(/[;；,，]/).map(s=>s.trim()).filter(Boolean).forEach(k=>kd[k]=(kd[k]||0)+1));
  lines.push('- 高频关键词 Top15：');Object.entries(kd).sort((a,b)=>b[1]-a[1]).slice(0,15).forEach(([k,v])=>lines.push('  - '+k+'（'+v+'）'));
  lines.push('');
  lines.push('## 五、我自己的选题（含可行性自评）');
  if(topics.length===0)lines.push('- （暂无，可在「我自己的选题」中补充）');
  topics.forEach(t=>lines.push('- **'+t.title+'**  \n  可行性：'+(t.feasibility||'未评')+'  \n  备注：'+(t.note||'—')));
  lines.push('');
  lines.push('---');
  downloadMD('选题与推荐库_'+todayStr()+'.md',lines.join('\n'));
  meta.lastTopicGen=Date.now();save('meta',meta);
  alert('已生成并下载 Markdown 文件。');
}

/* ============ 日程管理 ============ */
function cycleCount(g,date){
  const ds=dateStr(date);
  if(g.cycle==='每天')return g.checkIns.filter(d=>d===ds).length;
  if(g.cycle==='每周'){const wk=weekStart(date);return g.checkIns.filter(d=>d>=wk&&d<=ds).length;}
  if(g.cycle==='每月'){const m=ds.slice(0,7);return g.checkIns.filter(d=>d.slice(0,7)===m).length;}
  return 0;
}

      +'</div></div></div>';
  });

function addFtbz(){
  const name=document.getElementById('f_name').value.trim();
  if(!name){alert('请填写论文名称');return;}
  ftbz.push({id:uid(),name,version:parseInt(document.getElementById('f_ver').value)||1,

    days:parseInt(document.getElementById('f_days').value)||0,status:document.getElementById('f_status').value,demo:false});
  save('ftbz',ftbz);renderSchedule();
}
function updFtbz(id,f,v){
  const p=ftbz.find(x=>x.id===id);if(!p)return;
  if(f==='progress')v=Math.max(0,Math.min(100,parseInt(v)||0));
  if(f==='version'||f==='days')v=parseInt(v)||0;
  p[f]=v;save('ftbz',ftbz);renderSchedule();
}
function completeFtbz(id){
  const p=ftbz.find(x=>x.id===id);if(!p)return;
  if(!confirm('确认将《'+p.name+'》标记为完成并归入历史？'))return;
  ftbzHistory.push({id:p.id,name:p.name,version:p.version,progress:p.progress,status:p.status,days:p.days,
    completedAt:Date.now(),demo:!!p.demo});
  ftbz=ftbz.filter(x=>x.id!==id);
  save('ftbz',ftbz);save('ftbzHistory',ftbzHistory);renderSchedule();
}
function addGoal(){

function checkinGoal(id){

function updTodo(id,f,v){

/* ============ 分类平衡 Balance ============ */
let balanceUnit='周';
const CAT_COLORS={'科研':'#7aa7d4','爱好':'#b89ad6','课题':'#5fae7e','健康':'#e0a458','ai学习':'#e06b6b','AI学习':'#e06b6b','其他':'#9aa0a6','未分类':'#c9c4ba'};
function catColor(c){if(CAT_COLORS[c])return CAT_COLORS[c];const pal=['#7aa7d4','#b89ad6','#5fae7e','#e0a458','#e06b6b','#9aa0a6'];let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))>>>0;return pal[h%pal.length];}
function setBalanceUnit(u){balanceUnit=u;renderSchedule();}
function balanceHTML(){
  const t=todayStr();
  let pool=[];
  if(balanceUnit==='天')pool=todos.filter(x=>x.ddl===t);
  else if(balanceUnit==='周'){const ws=weekStart(new Date());const we=dateStr(new Date(new Date(ws).getTime()+6*864e5));pool=todos.filter(x=>x.ddl&&x.ddl>=ws&&x.ddl<=we);}
  else if(balanceUnit==='月'){const m=t.slice(0,7);pool=todos.filter(x=>x.ddl&&x.ddl.slice(0,7)===m);}
  else if(balanceUnit==='年'){const y=t.slice(0,4);pool=todos.filter(x=>x.ddl&&x.ddl.slice(0,4)===y);}
  const noDate=todos.filter(x=>!x.ddl).length;
  if(pool.length===0)return '<div class="empty">该时间范围内没有带截止日期的待办，无法统计分类平衡。</div>';
  const counts={};pool.forEach(x=>{const c=(x.category&&x.category.trim())?x.category.trim():'未分类';counts[c]=(counts[c]||0)+1;});
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const total=pool.length;
  let angle=0;const cx=70,cy=70,r=58;
  const segs=entries.map(([c,n])=>{
    const frac=n/total;const a0=angle;const a1=angle+frac*360;angle=a1;
    const x0=(cx+r*Math.cos((a0-90)*Math.PI/180)).toFixed(1),y0=(cy+r*Math.sin((a0-90)*Math.PI/180)).toFixed(1);
    const x1=(cx+r*Math.cos((a1-90)*Math.PI/180)).toFixed(1),y1=(cy+r*Math.sin((a1-90)*Math.PI/180)).toFixed(1);
    const large=frac>0.5?1:0;const col=catColor(c);
    return '<path d="M'+cx+' '+cy+' L'+x0+' '+y0+' A'+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' Z" fill="'+col+'"></path>';
  }).join('');
  const donut='<svg viewBox="0 0 140 140" width="150" height="150"><circle cx="70" cy="70" r="40" fill="#fff"></circle>'+segs+'<circle cx="70" cy="70" r="40" fill="#fff"></circle><text x="70" y="66" text-anchor="middle" font-size="12" fill="#8a8a96">共</text><text x="70" y="86" text-anchor="middle" font-size="18" fill="#3a3a44" font-weight="700">'+total+'</text></svg>';
  const bars=entries.map(([c,n])=>{const pct=Math.round(n/total*100);const col=catColor(c);return '<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>'+esc(c)+'</span><span class="muted">'+n+' 项 · '+pct+'%</span></div><div class="bar"><div class="bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div></div>';}).join('');
  const note=noDate>0?'<div class="muted" style="font-size:12px;margin-top:8px">另有 '+noDate+' 条未设截止日期，未计入本统计。</div>':'';
  return '<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center"><div style="flex-shrink:0">'+donut+'</div><div style="flex:1;min-width:230px">'+bars+'</div></div>'+note;
}
/* 水彩渐变花瓣：5 片椭圆花瓣绕中心旋转，填充径向渐变 */
/* 水彩山茶（层层叠叠的粉花瓣 + 金黄蕊） */
function camellia(cx,cy,r){
  let s='<g filter="url(#wc)">';
  for(let i=0;i<6;i++){const a=i*60*Math.PI/180;const px=(cx+Math.cos(a)*r*0.5).toFixed(1);const py=(cy+Math.sin(a)*r*0.5).toFixed(1);
    s+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(r*0.52).toFixed(1)+'" ry="'+(r*0.34).toFixed(1)+'" fill="url(#gCamellia)" transform="rotate('+(i*60)+' '+px+' '+py+')"/>';}
  for(let i=0;i<5;i++){const a=(i*72+30)*Math.PI/180;const px=(cx+Math.cos(a)*r*0.27).toFixed(1);const py=(cy+Math.sin(a)*r*0.27).toFixed(1);
    s+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(r*0.34).toFixed(1)+'" ry="'+(r*0.22).toFixed(1)+'" fill="url(#gCamellia)" transform="rotate('+(i*72+30)+' '+px+' '+py+')"/>';}
  s+='</g>';
  s+='<g stroke="#e9c878" stroke-width="1" opacity=".85">';
  for(let i=0;i<8;i++){const a=i*45*Math.PI/180;s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(a)*r*0.3).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r*0.3).toFixed(1)+'"/>';}
  s+='</g><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.1).toFixed(1)+'" fill="url(#gGold)"/>';
  return s;
}
/* 鼠尾草叶 */
function leaf(cx,cy,len,ang){
  return '<path d="M0 0 Q'+(len*0.5).toFixed(1)+' '+(-len*0.42).toFixed(1)+' '+len.toFixed(1)+' 0 Q'+(len*0.5).toFixed(1)+' '+(len*0.42).toFixed(1)+' 0 0 Z" transform="translate('+cx+' '+cy+') rotate('+ang+')" fill="url(#gSage)" filter="url(#wc)"/>';
}
/* 铃兰钟形花 */
function bell(cx,cy,w,h){
  return '<path d="M'+(cx-w)+' '+cy+' C'+(cx-w)+' '+(cy+h*0.25).toFixed(1)+' '+(cx-w*0.25).toFixed(1)+' '+(cy+h).toFixed(1)+' '+cx+' '+(cy+h).toFixed(1)+' C'+(cx+w*0.25).toFixed(1)+' '+(cy+h).toFixed(1)+' '+(cx+w)+' '+(cy+h*0.25).toFixed(1)+' '+(cx+w)+' '+cy+' Z" fill="url(#gBell)" filter="url(#wc)"/>';
}
/* 四角星芒 */
function spark(x,y,s,o){

    +'<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="#eee" stroke-width="5"/>'

    +'</svg>';
}

}

function setMood(m){mood[todayStr()]=m;save('mood',mood);renderHealth();}
function saveSleep(){
  const y=dateStr(new Date(Date.now()-864e5));
  sleep[y]={bed:document.getElementById('s_bed').value,wake:document.getElementById('s_wake').value,quality:document.getElementById('s_q').value};
  save('sleep',sleep);updateSleepDur();alert('已保存昨日睡眠');
}
function updateSleepDur(){
  const el=document.getElementById('sleepDur');if(!el)return;
  const b=document.getElementById('s_bed').value,w=document.getElementById('s_wake').value;
  const bh=parseInt(b.split(':')[0]),wm=parseInt(w.split(':')[0]);
  let h=(wm-bh+24)%24;if(h===0)h=24;
  el.textContent='预计睡眠时长：约 '+h+' 小时';
}
function addExercise(){
  const type=document.getElementById('e_type').value.trim();
  if(!type){alert('请填写运动项目');return;}
  exercises.push({id:uid(),type,duration:parseInt(document.getElementById('e_dur').value)||0,date:document.getElementById('e_date').value||todayStr()});
  save('exercises',exercises);renderHealth();
}
function delExercise(id){exercises=exercises.filter(e=>e.id!==id);save('exercises',exercises);renderHealth();}
function addHobby(){
  const name=document.getElementById('h_name').value.trim();
  if(!name){alert('请填写内容');return;}
  hobbies.push({id:uid(),name,date:document.getElementById('h_date').value||todayStr()});
  save('hobbies',hobbies);renderHealth();
}
function delHobby(id){hobbies=hobbies.filter(h=>h.id!==id);save('hobbies',hobbies);renderHealth();}

function exportJSON(){
  const data={papers,topics,ftbz,ftbzHistory,goals,todos,exercises,hobbies,mood,sleep,meta,__v:1};
  downloadBlob('科研很柯以工作台备份_'+todayStr()+'.json',JSON.stringify(data,null,2),'application/json');
}

  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(Array.isArray(d.papers))papers=d.papers;
      if(Array.isArray(d.topics))topics=d.topics;
      if(Array.isArray(d.ftbz))ftbz=d.ftbz;
      if(Array.isArray(d.ftbzHistory))ftbzHistory=d.ftbzHistory;
      if(Array.isArray(d.goals))goals=d.goals;
      if(Array.isArray(d.todos))todos=d.todos;
      if(Array.isArray(d.exercises))exercises=d.exercises;
      if(Array.isArray(d.hobbies))hobbies=d.hobbies;
      if(d.mood)mood=d.mood;
      if(d.sleep)sleep=d.sleep;
      if(d.meta)meta=d.meta;
      saveAll();
      showView(curView);
      alert('导入成功，共恢复数据。');
    }catch(err){alert('导入失败：文件格式错误。');}
  };
  r.readAsText(file);
  document.getElementById('importFile').value='';
}

function clearAll(){
  if(!confirm('确定清空全部数据？此操作不可恢复！建议先导出备份。'))return;
  if(!confirm('再次确认：真的要清空所有数据吗？'))return;
  papers=[];topics=[];ftbz=[];ftbzHistory=[];goals=[];todos=[];exercises=[];hobbies=[];mood={};sleep={};

/* ============ 弹窗 / 历史 ============ */
function showHistory(type){
  let html='',title='';
  if(type==='ftbz'){
    title='逢投必中 · 历史';
    if(ftbzHistory.length===0)html='<div class="empty">暂无完成记录。</div>';
    else ftbzHistory.slice().reverse().forEach(h=>{
      html+='<div class="hist-item"><b>'+esc(h.name)+'</b><br>版本'+h.version+' · 进度'+h.progress+'% · '+h.status+' · 撰写'+h.days+'天<br><span class="muted">完成于 '+dateStr(new Date(h.completedAt))+'</span></div>';
    });
  }else if(type==='todo'){
    title='待办 · 已完成';
    const done=todos.filter(t=>t.done);
    if(done.length===0)html='<div class="empty">暂无完成记录。</div>';
    else done.slice().reverse().forEach(t=>{
      html+='<div class="hist-item"><b>'+esc(t.name)+'</b> <span class="muted">('+esc(t.category||'')+')</span><br><span class="muted">完成于 '+(t.doneAt?dateStr(new Date(t.doneAt)):'')+'</span></div>';
    });
  }else if(type==='goal'){
    title='目标打卡 · 历史';
    if(goals.length===0)html='<div class="empty">暂无目标。</div>';
    else goals.forEach(g=>{
      html+='<div class="hist-item"><b>'+esc(g.name)+'</b>（'+g.cycle+'/目标'+g.target+'）<br><span class="muted">打卡 '+g.checkIns.length+' 次：'+(g.checkIns.join('、')||'无')+'</span></div>';
    });
  }else if(type==='topicgen'){
    title='选题库生成记录';
    html='<div class="hist-item">'+(meta.lastTopicGen?('上次生成：'+new Date(meta.lastTopicGen).toLocaleString('zh-CN')):'尚未生成过')+'</div>';
    html+='<div class="hist-item muted">在「科研热点」页点「生成并下载 Markdown」即可聚合当前论文并导出。</div>';
  }
  document.getElementById('modalBody').innerHTML='<h3><span>'+title+'</span><button class="icon-btn" onclick="closeModal()" style="margin-left:auto">'+ICON.close+'</button></h3>'+html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function toggleForm(id){document.getElementById(id).classList.toggle('show');}

/* ============ 下载 ============ */
function downloadBlob(name,content,type){
  const blob=new Blob([content],{type:type+';charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function downloadMD(name,content){downloadBlob(name,content,'text/markdown');}

function applyFeed(j,force,src){
  if(!j||!Array.isArray(j.papers))return;
  let added=0,updated=0;
  j.papers.forEach(p=>{
    if(!p||!p.id)return;
    const idx=papers.findIndex(x=>x.id===p.id);
    if(idx===-1){ papers.push(Object.assign({seed:true,field:p.field||'通用'},p)); added++; }
    else if(papers[idx].seed){
      const keep={intensive:papers[idx].intensive};
      keep.ignored= force ? false : (papers[idx].ignored||false);
      papers[idx]=Object.assign({seed:true},p,keep); updated++;
    }
  });
  if(added||updated||force){ save('papers',papers); if(curView==='research')renderResearch(); }
  if(force){
    if(added>0)alert('已从'+src+'推荐源载入 '+added+' 篇论文到「科研热点」。');
    else if(updated>0)alert('已恢复 '+updated+' 篇推荐论文（含之前忽略的，来源：'+src+'）。');
    else alert('推荐源（'+src+'）已是最新，没有可恢复的论文。');
  }
}
function loadFeed(force){
  fetch('./papers_feed.json?t='+Date.now()).then(r=>r.ok?r.json():null)
    .then(j=>{ if(j&&Array.isArray(j.papers))applyFeed(j,force,'在线'); else applyFeed(FALLBACK_FEED,force,'内置'); })
    .catch(()=>{ applyFeed(FALLBACK_FEED,force,'内置'); });
}
function reloadFeed(){ loadFeed(true); }
